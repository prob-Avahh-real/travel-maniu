<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#f6efe0" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>旅行马牛</title>
<link rel="stylesheet" href="src/ui/style.css" />
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="hud-left">
      <span id="clover-count" class="pill">🪙 0</span>
      <span id="ready-count" class="pill muted">成熟 0</span>
      <span id="floral-count" class="pill muted" hidden>🌸0 🍂0</span>
    </div>
    <div class="hud-right">
      <span id="maniu-status" class="status">马牛在家</span>
      <button id="wearable-enable" class="ghost" hidden aria-label="连接戒指与手杖">◍</button>
      <span id="wearable-status" class="status tiny"></span>
      <button id="btn-settings" class="ghost" aria-label="设置">⋯</button>
    </div>
  </header>

  <main id="stage">
    <canvas id="scene" width="600" height="900" aria-label="马牛的房间"></canvas>
    <div id="tabs" class="tabs">
      <button data-view="room" class="tab active">房间</button>
      <button data-view="garden" class="tab">庭院</button>
    </div>
  </main>

  <nav id="nav">
    <button data-sheet="luggage" class="nav-btn"><i>🎒</i><span>行囊</span></button>
    <button data-sheet="shop" class="nav-btn"><i>🏮</i><span>商店</span></button>
    <button data-sheet="album" class="nav-btn"><i>🖼</i><span>相册</span></button>
    <button data-sheet="souvenirs" class="nav-btn"><i>🫙</i><span>特产</span></button>
    <button data-sheet="map" class="nav-btn"><i>🗺</i><span>地图</span></button>
    <button data-sheet="games" class="nav-btn"><i>🎯</i><span>坊间</span></button>
    <button data-sheet="titles" class="nav-btn"><i>🎖</i><span>称号</span></button>
  </nav>

  <div id="secondary" class="secondary">
    <button id="btn-pick" class="action">摘铜钱草</button>
    <button id="btn-floral" class="action" hidden>拾花叶</button>
    <button id="btn-wish" class="action" hidden>向流水许愿</button>
    <button id="btn-feed" class="action alt" hidden>招待访客</button>
  </div>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-head">
      <h2 id="sheet-title">行囊</h2>
      <button id="sheet-close" class="ghost" aria-label="关闭">✕</button>
    </div>
    <div id="sheet-body" class="sheet-body"></div>
  </div>

  <div id="toast" class="toast" hidden></div>
</div>
<script type="module" src="src/ui/app.js"></script>
</body>
</html>
